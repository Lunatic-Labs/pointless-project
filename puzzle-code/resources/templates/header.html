<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>%TITLE &mdash; Pointless Challenge</title>
    <style>
        #theme-btn {font-size: 1.5rem; cursor: pointer; color: #596AFF;}
        #theme-btn:hover {color: #BB86FC;}
        .changeTheme {background: #1D1E22; color: #eee;}
        /* A solid extrusion (stacked 1px shadows) instead of a detached drop shadow. Dark mode swaps
           face and side, since the purple face vanishes on the dark background. */
        .title {
            --title-face: #331E54; --title-side: #F4AA00; --title-edge: #B87F00;
            font-size: 72px; font-weight: bold; color: var(--title-face);
            text-shadow: 1px 1px 0 var(--title-side), 2px 2px 0 var(--title-side), 3px 3px 0 var(--title-side),
                         4px 4px 0 var(--title-side), 5px 5px 0 var(--title-edge);
        }
        .changeTheme .title {--title-face: #F4AA00; --title-side: #6A45A8; --title-edge: #331E54;}
        /* A block, so the bison's hooves are its bottom edge (an inline SVG sits on the text baseline). */
        .imagen {padding-left: 28px;}
        .imagen svg {display: block;}
        .container {
            width: 80%;
            max-width: 52rem;
            margin: 0 auto; /* The bison stands on the box. */
            padding: 20px 32px;
            border: 1px solid #ccc;
            border-radius: 8px;
            line-height: 1.45;
        }
        .container h2 {margin-top: 0.5em;}
        .container li {margin: 0.2em 0;}
        .container code {font-size: 1.05em;}
        /* A dark box for the facts a puzzle gives the player (the pixel, encrypt, and rematch pages). */
        .container .callout {
            width: fit-content;
            max-width: 100%;
            box-sizing: border-box;
            padding: 8px 20px;
            border-radius: 8px;
            background-color: #331E54;
            color: rgb(255, 217, 90);
        }
        /* A figure (a maze, a light box, a table) goes on its own line, left aligned with the text. */
        .container .figure {margin: 1em 0; width: fit-content; max-width: 100%; overflow-x: auto;}
        .container .question {font-weight: bold; margin-top: 1.5em;}
        /* Every puzzle page is two columns: the puzzle on the left, and on the right the sidebar
           utils_html_printf() builds (proof of progress, score, inventory). Narrow windows get
           one column, with the sidebar under the puzzle. */
        .container .layout {display: flex; align-items: flex-start; gap: 24px;}
        .container .layout > section {flex: 1 1 auto; min-width: 0;}
        .container .sidebar {
            flex: 0 0 13rem;
            box-sizing: border-box;
            margin-top: 0.5em; /* Level with the heading the puzzle starts with. */
            padding: 8px 20px;
            border: 2px dashed #F4AA00;
            border-radius: 8px;
        }
        .container .sidebar p {margin: 0.35em 0;}
        .container .sidebar .token code {font-size: 1.2em; font-weight: bold; letter-spacing: 0.1em;}
        .container .sidebar .hint {font-size: 0.85em;}
        .container .sidebar .points {margin-top: 1.2em; font-weight: bold;}
        .container .sidebar .inventory {margin-top: 1.2em;}
        .container .sidebar ul {margin: 0.35em 0; padding-left: 1.2em;}
        @media (max-width: 60rem) {
            .container .layout {display: block;}
            .container .sidebar {width: fit-content; max-width: 100%; margin-top: 1.5em;}
        }
    </style>
</head>
