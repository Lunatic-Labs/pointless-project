name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # 22.04 matches tools.lipscomb-soc.org (g++ 11, PHP 8.1), where the deploy
    # builds and tests this repo; 24.04 is what developers are likely to have.
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y g++ libzip-dev php-cli

      - name: Puzzle generator tests
        working-directory: puzzle-code
        run: make test

      # This checkout's own production tree, so the website's real-generator test runs instead of being skipped.
      - name: Build the production generator
        working-directory: puzzle-code
        run: make production

      - name: Website tests
        run: php web-server/tests/run.php
